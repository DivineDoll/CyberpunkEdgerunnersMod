name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Compilar el mod
        run: gradle build

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: edgerunners-jar
          path: build/libs/*.jar
